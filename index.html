<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Seiza</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="theme-color" content="#0d0a1f">
</head>
<body>

  <header>
    <div class="header-left">
      <h1 class="site-title">Seiza</h1>
      <a href="pages/profile.html" id="profile-name" class="profile-name" title="View your profile"></a>
    </div>
    <div class="header-progress">
      <span id="overall-progress" class="overall-progress"></span>
    </div>
    <div class="header-actions">
      <a href="pages/library.html" class="btn-link">Library</a>
      <a href="pages/achievements.html" class="btn-link">Achievements</a>
      <a href="pages/settings.html" class="btn-link">Settings</a>
    </div>
  </header>

  <div id="branch-progress" class="branch-progress"></div>

  <main>
    <div class="graph-wrap">
      <div class="map-search">
        <div class="map-search-row">
          <input type="text" id="map-search-input" placeholder="Search the sky...">
          <button type="button" id="learning-toggle" class="learning-toggle-btn" aria-pressed="false" title="Show only what you're actively learning">Learning</button>
        </div>
        <p class="map-search-empty" id="map-search-empty" hidden>
          No node called "<span id="map-search-empty-term"></span>" yet.
          <a href="pages/suggest.html">Suggest it?</a>
        </p>
      </div>
      <svg id="star-map" viewBox="-3600 -3550 7360 7100" preserveAspectRatio="xMidYMid meet"></svg>
      <div class="zoom-controls">
        <button id="zoom-in" aria-label="Zoom in">+</button>
        <button id="zoom-out" aria-label="Zoom out">&minus;</button>
      </div>
    </div>

    <div id="panel-backdrop" class="panel-backdrop"></div>
    <aside id="side-panel" class="side-panel"></aside>
  </main>

  <div id="toast-container"></div>

  <nav class="tab-bar">
    <a href="index.html" class="tab-bar-item active">
      <svg class="tab-bar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 8 L12 17 M17 6 L12 17 M6 8 L17 6"/>
        <circle cx="6" cy="8" r="1.7" fill="currentColor" stroke="none"/>
        <circle cx="17" cy="6" r="1.7" fill="currentColor" stroke="none"/>
        <circle cx="12" cy="17" r="1.7" fill="currentColor" stroke="none"/>
      </svg>
      <span>Map</span>
    </a>
    <a href="pages/library.html" class="tab-bar-item">
      <svg class="tab-bar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 5h16M4 12h16M4 19h10"/>
      </svg>
      <span>Library</span>
    </a>
    <a href="pages/achievements.html" class="tab-bar-item">
      <svg class="tab-bar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3l2.5 6 6.5.5-5 4.3 1.5 6.2L12 16.5 6.5 20l1.5-6.2-5-4.3 6.5-.5z"/>
      </svg>
      <span>Achievements</span>
    </a>
    <a href="pages/profile.html" class="tab-bar-item">
      <svg class="tab-bar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
        <circle cx="12" cy="12" r="9"/>
        <circle cx="12" cy="12" r="3.2" fill="currentColor" stroke="none"/>
      </svg>
      <span>Profile</span>
    </a>
  </nav>

  <script src="js/tabBarHeight.js"></script>
  <script src="js/data.js"></script>
  <script src="js/progress.js"></script>
  <script src="js/db.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/library.js"></script>
  <script src="js/achievements.js"></script>
  <script src="js/graph.js"></script>
  <script src="js/panel.js"></script>
  <script src="js/toast.js"></script>
  <script src="js/app.js"></script>
  <script src="js/registerSW.js"></script>
</body>
</html>
