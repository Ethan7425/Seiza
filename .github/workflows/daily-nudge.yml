name: Daily reminder push

on:
  schedule:
    # Runs hourly so 10am local time gets checked regardless of which
    # timezone a profile is in — send-nudges.mjs only actually sends
    # once that matches AND the profile hasn't been nudged today.
    # Deliberately NOT on the round hour (":00") — GitHub's own docs
    # warn that's the most congested slot for scheduled workflows and
    # can be delayed or dropped outright, which is exactly what
    # happened the one time this was ":00".
    - cron: "7 * * * *"
  workflow_dispatch: {} # lets you trigger a run manually from the Actions tab, for testing

jobs:
  send-nudges:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: scripts
        run: npm install

      - name: Send due reminders
        working-directory: scripts
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
        run: node send-nudges.mjs
