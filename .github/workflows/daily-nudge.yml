name: Daily reminder push

on:
  schedule:
    # Runs 4x/hour so a reminder set to a specific minute (not just an
    # hour) still lands within send-nudges.mjs's ~20-minute catch
    # window. Deliberately NOT on the round quarter-hours (:00/:15/:30/
    # :45) — GitHub's own docs warn those exact slots are the most
    # congested for scheduled workflows and can be delayed or dropped
    # outright, which is exactly what happened when this was ":00".
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch: {} # lets you trigger a run manually from the Actions tab, for testing

jobs:
  send-nudges:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: scripts
        run: npm install

      - name: Send due reminders
        working-directory: scripts
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
        run: node send-nudges.mjs
