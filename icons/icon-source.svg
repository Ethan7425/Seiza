<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="75%">
      <stop offset="0%" stop-color="#1f1940"/>
      <stop offset="100%" stop-color="#0d0a1f"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- faint scattered stars, echoing the map's background -->
  <circle cx="120" cy="130" r="2.6" fill="#cfc9e0" opacity="0.35"/>
  <circle cx="392" cy="112" r="2" fill="#cfc9e0" opacity="0.3"/>
  <circle cx="418" cy="362" r="2.6" fill="#cfc9e0" opacity="0.3"/>
  <circle cx="96" cy="382" r="2" fill="#cfc9e0" opacity="0.35"/>
  <circle cx="256" cy="88" r="1.8" fill="#cfc9e0" opacity="0.28"/>
  <circle cx="150" cy="410" r="1.8" fill="#cfc9e0" opacity="0.25"/>
  <circle cx="360" cy="420" r="1.6" fill="#cfc9e0" opacity="0.22"/>

  <!-- a "mastered" node: halo + ring + core, same motif used on the map -->
  <circle cx="256" cy="256" r="130" fill="#d8a05c" opacity="0.2" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="96" fill="none" stroke="#d8a05c" stroke-width="7" opacity="0.85"/>
  <circle cx="256" cy="256" r="60" fill="#d8a05c"/>
</svg>
