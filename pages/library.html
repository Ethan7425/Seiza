<body>

    <div class="library-card">

  <nav class="tab-bar">
    <a href="../index.html" class="tab-bar-item">
      <svg class="tab-bar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">

        <circle cx="6" cy="8" r="1.7" fill="currentColor" stroke="none"/>

        <circle cx="12" cy="17" r="1.7" fill="currentColor" stroke="none"/>
      </svg>

    <a href="library.html" class="tab-bar-item active">

      <svg class="tab-bar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3l2.5 6 6.5.5-5 4.3 1.5 6.2L12 16.5 6.5 20l1.5-6.2-5-4.3 6.5-.5z"/>
      </svg>

    <a href="profile.html" class="tab-bar-item">
      <svg class="tab-bar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
        <circle cx="12" cy="12" r="9"/>
        <circle cx="12" cy="12" r="3.2" fill="currentColor" stroke="none"/>
      </svg>

  <script src="../js/data.js"></script>
  <script src="../js/db.js"></script>
  <script src="../js/storage.js"></script>
  <script src="../js/library.js"></script>
  <script src="../js/libraryPage.js"></script>
  <script>
    let state;

    const ALL_CATALOG_NODES = NODES.concat(LIBRARY_NODES);

    (async () => {
      state = await loadState();
      if (!state) {
        location.href = "welcome.html";
        return;
      }
      initLibraryPage(document.getElementById("library-content"), {
        onAdd: handleAddNode,
        onAddBranch: handleAddBranch,
        onRemove: handleRemoveNode,
        onRemoveBranch: handleRemoveBranch,
        isAdded: id => state.addedLibraryIds.includes(id) || state.addedCoreNodeIds.includes(id)
      });
    })();

    function isAdded(id) {
      return state.addedLibraryIds.includes(id) || state.addedCoreNodeIds.includes(id);
    }

    // Marks one node as added and gives it a fresh progress entry —
    // positions aren't touched here at all, since buildActiveNodes now
    // computes the whole branch's layout fresh every time it's called,
    // so there's nothing to precompute or store.
    function markAdded(template) {
      if (NODES.some(n => n.id === template.id)) {
        state.addedCoreNodeIds.push(template.id);
      } else {
        state.addedLibraryIds.push(template.id);
      }
      state.progress[template.id] = { stage: "locked", notes: "", proof: [], updatedAt: null, quantity: "" };
    }

    function handleAddNode(nodeId) {
      if (isAdded(nodeId)) return;
      const template = ALL_CATALOG_NODES.find(n => n.id === nodeId);
      if (!template) return;

      markAdded(template);
      saveState(state);
      refreshLibraryResults();
    }

    // Adding an entire branch at once means anything that depends on
    // a sibling within the same branch (e.g. Basic Astronomy needing
    // Constellations & Star Navigation) is guaranteed to actually be
    // reachable, instead of silently staying locked on a dependency
    // that was never added.
    function handleAddBranch(branchId) {
      const toAdd = ALL_CATALOG_NODES.filter(n => n.branch === branchId && !isAdded(n.id));
      if (!toAdd.length) return;

      toAdd.forEach(markAdded);
      saveState(state);
      refreshLibraryResults();
    }

    // A node with something still depending on it can't be removed —
    // same rule the map's own "Remove from map" button enforces —
    // otherwise the dependent would end up permanently stuck locked on
    // something that no longer exists at all.
    function findBlockingDependents(nodeIds) {
      const removing = new Set(nodeIds);
      return buildActiveNodes(state).filter(n =>
        !removing.has(n.id) && n.dependsOn.some(depId => removing.has(depId))
      );
    }

    function forgetNode(nodeId) {
      delete state.progress[nodeId];
      delete state.nodePositions[nodeId];
      state.addedLibraryIds = state.addedLibraryIds.filter(id => id !== nodeId);
      state.addedCoreNodeIds = state.addedCoreNodeIds.filter(id => id !== nodeId);
    }

    function handleRemoveNode(nodeId) {
      if (!isAdded(nodeId)) return;
      const template = ALL_CATALOG_NODES.find(n => n.id === nodeId);
      if (!template) return;

      const blockers = findBlockingDependents([nodeId]);
      if (blockers.length) {
        alert(`Can't remove "${template.name}" — ${blockers.map(b => b.name).join(", ")} still depend${blockers.length === 1 ? "s" : ""} on it.`);
        return;
      }

      const confirmed = confirm(`Remove "${template.name}" from your map? This deletes its progress, notes, and evidence log. This can't be undone.`);
      if (!confirmed) return;

      forgetNode(nodeId);
      saveState(state);
      refreshLibraryResults();
    }

    function handleRemoveBranch(branchId) {
      const added = ALL_CATALOG_NODES.filter(n => n.branch === branchId && isAdded(n.id));
      if (!added.length) return;

      const blockers = findBlockingDependents(added.map(n => n.id));
      if (blockers.length) {
        alert(`Can't remove the whole branch — ${blockers.map(b => b.name).join(", ")} (outside this branch) still depend${blockers.length === 1 ? "s" : ""} on something in it.`);
        return;
      }

      const confirmed = confirm(`Remove all ${added.length} added node${added.length === 1 ? "" : "s"} in "${BRANCHES[branchId].label}"? This deletes their progress, notes, and evidence logs. This can't be undone.`);
      if (!confirmed) return;

      added.forEach(n => forgetNode(n.id));
      saveState(state);
      refreshLibraryResults();
    }
  </script>
  <script src="../js/registerSW.js"></script>
</body>
</html>
