<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Seiza — Welcome</title>
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="manifest" href="../manifest.json">
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
  <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
  <meta name="theme-color" content="#0d0a1f">
</head>
<body>

  <div class="centered-page">
    <div id="welcome-card" class="welcome-card"></div>
  </div>

  <script src="../js/data.js"></script>
  <script src="../js/db.js"></script>
  <script src="../js/storage.js"></script>
  <script src="../js/welcome.js"></script>
  <script>
    (async () => {
      const state = await loadState();
      if (state) {
        location.href = "../index.html";
        return;
      }

      initWelcome(document.getElementById("welcome-card"), {
        // Just a lookup — no side effects. Returns the profile's data
        // blob if that name exists, or null if it's free to create.
        onNameCheck: name => dbLoadProfile(name),

        // Returns true/false for whether the PIN matched. On a match it
        // signs in and redirects; welcome.js only sees false (to show
        // "Incorrect PIN" and let them retry).
        onSignIn: async (name, pin, existingData) => {
          if (existingData.pin !== pin) return false;
          setProfileKey(name);
          showSuccessAndRedirect(`Welcome back, ${name} &#9734;`);
          return true;
        },

        onCreateProfile: async (name, pin) => {
          const newState = createBlankState(name);
          newState.pin = pin;
          setProfileKey(name);
          try {
            await saveStateNow(name, newState);
          } catch (e) {
            alert(`Couldn't reach the database: ${e.message}`);
            clearProfileKey();
            return;
          }
          showSuccessAndRedirect(`Your sky is ready, ${name} &#9734;`);
        }
      });
    })();

    // A brief confirmation moment before handing off to the map, instead
    // of an instant jump — gives sign-in an actual "yes, that worked"
    // beat rather than the page just vanishing.
    function showSuccessAndRedirect(message) {
      const card = document.getElementById("welcome-card");
      card.innerHTML = `
        <div class="welcome-brand"><img src="../favicon.svg" class="welcome-brand-icon" alt=""></div>
        <p class="welcome-success">${message}</p>
      `;
      card.classList.remove("step-enter");
      void card.offsetWidth;
      card.classList.add("step-enter");
      setTimeout(() => { location.href = "../index.html"; }, 550);
    }
  </script>
  <script src="../js/registerSW.js"></script>
</body>
</html>
