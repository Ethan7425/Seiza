<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seiza — Sign In</title>
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="manifest" href="../manifest.json">
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
  <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
  <meta name="theme-color" content="#0d0a1f">
</head>
<body>

  <div class="centered-page">
    <div id="welcome-card" class="welcome-card"></div>
  </div>

  <script src="../js/data.js"></script>
  <script src="../js/db.js"></script>
  <script src="../js/storage.js"></script>
  <script src="../js/quiz.js"></script>
  <script src="../js/welcome.js"></script>
  <script>
    (async () => {
      const state = await loadState();
      if (state) {
        location.href = "../index.html";
        return;
      }

      initWelcome(document.getElementById("welcome-card"), {
        // Just a lookup — no side effects. Returns the profile's data
        // blob if that name exists, or null if it's free to create.
        onNameCheck: name => dbLoadProfile(name),

        // Returns true/false for whether the PIN matched. On a match it
        // signs in and redirects; welcome.js only sees false (to show
        // "Incorrect PIN" and let them retry).
        onSignIn: async (name, pin, existingData) => {
          if (existingData.pin !== pin) return false;
          setProfileKey(name);
          location.href = "../index.html";
          return true;
        },

        onCreateProfile: async (name, pin, answers) => {
          const newState = createStateFromAnswers(name, answers);
          newState.pin = pin;
          setProfileKey(name);
          try {
            await saveStateNow(name, newState);
          } catch (e) {
            alert(`Couldn't reach the database: ${e.message}`);
            clearProfileKey();
            return;
          }
          location.href = "../index.html";
        }
      });
    })();
  </script>
  <script src="../js/registerSW.js"></script>
</body>
</html>
